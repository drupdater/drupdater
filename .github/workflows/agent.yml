name: Agent

# The PHP half of drupdater: agent/, the `composer drupdater:*` commands the image installs. Its
# protocol fixtures are shared with internal/agent, whose side go.yml tests on every push.
on:
  push:
    branches: [ "main" ]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest and the highest PHP the image is published for.
        php: [ "8.2", "8.5" ]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHPUnit
        run: vendor/bin/phpunit

  # The agent's counterpart of go.yml's `mutation` job: Infection on the lines the pull request
  # changes, blocking below the same 75 % MSI. mutation.yml scores all of it weekly.
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          # --git-diff-lines diffs against the merge base, which needs history.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:2.10
          coverage: pcov

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Mutation testing on changed lines
        run: |
          vendor/bin/infection \
            --threads=max \
            --git-diff-lines \
            --git-diff-base=origin/${{ github.base_ref }} \
            --ignore-msi-with-no-mutations \
            --min-msi=75 \
            --logger-github \
            --no-progress

      - name: Mutation Summary
        if: always()
        run: |
          echo "## Mutation Testing, agent (changed lines)" >> $GITHUB_STEP_SUMMARY
          if [ ! -f build/infection/summary.json ]; then
            echo "No summary produced." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          jq -r '
            if .stats.totalMutantsCount == 0 then
              "No mutable lines changed."
            else
              "**MSI:** \(.stats.msi | floor)% "
              + "(\(.stats.killedCount) killed, \(.stats.escapedCount) escaped, "
              + "\(.stats.notCoveredCount) not covered, \(.stats.totalMutantsCount) total)"
            end
          ' build/infection/summary.json >> $GITHUB_STEP_SUMMARY
