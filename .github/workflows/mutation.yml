name: Mutation Testing

# Scores the whole module with mutation testing: every mutant that survives is a
# line the tests execute but do not actually check.
#
# Deliberately informational -- it never fails the build. The blocking gate is
# the `mutation` job in go.yml, which scores only the lines a pull request
# changes. This run exists to track the module-wide score over time and to
# produce a worklist of surviving mutants in existing code.
#
# Split one leg per package rather than a single `./...` run: the whole module
# is ~3000 mutants and over half an hour serially, where the matrix finishes in
# the time of its slowest package. A leg that fails or times out can be re-run
# on its own, and `fail-fast: false` keeps one bad package from discarding the
# other thirteen results.
#
# The per-package `mutation-report-*` artifacts hold mutago-agentic.json: each
# survivor with its diff, surrounding context and the test file that should have
# caught it. Download them to pick off survivors package by package.

on:
  schedule:
    # Mondays, 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Discover the packages to score instead of hardcoding them, so adding a
  # package to the module adds a leg here automatically. Packages without tests
  # are skipped -- mutago has nothing to score there.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: List packages with tests
        id: list
        run: |
          module=$(go list -m)
          packages=$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./... \
            | sed "s|^$module$|.|; s|^$module/|./|" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Scoring: $packages"

  mutate:
    name: mutate ${{ matrix.package }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Artifact names cannot contain "/", and the aggregate job needs to know
      # which package a summary came from.
      - name: Derive slug
        id: slug
        run: echo "slug=$(echo '${{ matrix.package }}' | sed 's|^\./||; s|/|_|g; s|^\.$|root|')" >> "$GITHUB_OUTPUT"

      - name: Mutation testing
        continue-on-error: true
        run: |
          go tool mutago \
            --config mutago.yaml \
            --coverage \
            --logger-summary-json \
            --logger-agentic-json \
            --quiet \
            --no-diffs \
            ${{ matrix.package }}

      # Tag the summary with its package so the aggregate job can label rows.
      - name: Label summary
        if: always()
        run: |
          if [ -s mutago-summary.json ]; then
            jq --arg p '${{ matrix.package }}' '. + {package: $p}' mutago-summary.json \
              > "summary-${{ steps.slug.outputs.slug }}.json"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ steps.slug.outputs.slug }}
          path: |
            summary-${{ steps.slug.outputs.slug }}.json
            mutago-agentic.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: aggregate
    needs: mutate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-report-*
          merge-multiple: true
          path: reports

      # MSI is killed/total and covered-code MSI is killed/(total - notCovered),
      # so both aggregate by summing counts. Averaging the per-package
      # percentages would weight a 26-mutant package like a 424-mutant one.
      - name: Module-wide score
        run: |
          shopt -s nullglob
          files=(reports/summary-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No package summaries were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## Mutation Testing (full module)" >> "$GITHUB_STEP_SUMMARY"
          jq -s -r '
            def pct($n; $d): if $d == 0 then "n/a" else "\($n * 10000 / $d | round / 100)%" end;
            (map(.killedCount)         | add) as $killed
            | (map(.totalMutantsCount) | add) as $total
            | (map(.escapedCount)      | add) as $escaped
            | (map(.notCoveredCount)   | add) as $notCovered
            | (map(.errorCount)        | add) as $errored
            | "| Metric | Value |", "|---|---|",
              "| MSI | \(pct($killed; $total)) |",
              "| Covered-code MSI | \(pct($killed; $total - $notCovered)) |",
              "| Killed | \($killed) |",
              "| Escaped | \($escaped) |",
              "| Not covered | \($notCovered) |",
              "| Errored | \($errored) |",
              "| Total mutants | \($total) |",
              "| Packages scored | \(length) |"
          ' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Per package" >> "$GITHUB_STEP_SUMMARY"
          jq -s -r '
            "| Package | MSI | Escaped | Mutants |", "|---|---|---|---|",
            (sort_by(.msi)[] |
              "| `\(.package)` | \(.msi * 10000 | round / 100)% | \(.escapedCount) | \(.totalMutantsCount) |")
          ' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
