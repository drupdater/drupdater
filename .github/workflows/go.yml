# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./... -coverprofile=coverage.txt

    - name: Coverage Summary
      if: always()
      run: |
        echo "## Go Test Coverage" >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.txt \
          | tail -1 \
          | awk '{print "**Total:** " $3}' \
          >> $GITHUB_STEP_SUMMARY

    - name: Upload results to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # Separate from `test` so the coverage profile comes from an uninstrumented run and the two
  # go in parallel. The suite is hermetic but genuinely concurrent -- an errgroup per site, and
  # addons accumulating state across those goroutines -- and no amount of coverage or mutation
  # score can see a data race.
  race:
    name: race
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Slower than it looks: pkg/composer and pkg/drush fake subprocesses by re-executing the
      # test binary, and under -race every one of those execs starts an instrumented process.
      - name: Test with the race detector
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  lint-dockerfile:
    name: lint-dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  deadcode:
    name: deadcode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check for dead code
        run: go tool deadcode -test ./... | tee /tmp/deadcode.txt; [ ! -s /tmp/deadcode.txt ]

  # Mutation testing, scoped to the lines this pull request touches: the whole module takes
  # ~20 minutes and would fail on pre-existing survivors. mutation.yml covers those weekly.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # --git-diff-lines diffs against the merge base, which needs history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Mutation testing on changed lines
        run: |
          go tool mutago \
            --config mutago.yaml \
            --coverage \
            --git-diff-lines \
            --git-diff-base origin/${{ github.base_ref }} \
            --ignore-msi-with-no-mutations \
            --min-msi 75 \
            --logger-github \
            --logger-summary-json \
            --quiet \
            --no-diffs \
            ./...

      - name: Mutation Summary
        if: always()
        run: |
          echo "## Mutation Testing (changed lines)" >> $GITHUB_STEP_SUMMARY
          if [ ! -f mutago-summary.json ]; then
            echo "No summary produced." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          jq -r '
            if .totalMutantsCount == 0 then
              "No mutable lines changed."
            else
              "**MSI:** \(.msi * 100 | floor)% "
              + "(\(.killedCount) killed, \(.escapedCount) escaped, "
              + "\(.notCoveredCount) not covered, \(.totalMutantsCount) total)"
            end
          ' mutago-summary.json >> $GITHUB_STEP_SUMMARY

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
